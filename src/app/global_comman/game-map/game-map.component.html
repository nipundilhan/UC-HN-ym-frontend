<div class="pyramid-map-container">
    <div class="header-container">
      <h1>The Great Pyramid of Knowledge</h1>
      <p>Unlock badges to advance through the chambers!</p>
    </div>
  
    <div class="pyramid-map">
      <div class="chamber" id="game1" (mouseover)="showProgress('game1')" >
        <div class="chamber-icon">
          <img src="/assets/hieroglyph1.png" alt="Game 1" />
          <h4>Game 1</h4>
        </div>
        <div class="progress" *ngIf="currentGame === 'game1'">3/5 Badges Earned</div>
      </div>
      
      <div class="chamber" id="game2" (mouseover)="showProgress('game2')" (mouseleave)="hideProgress()">
        <div class="chamber-icon">
          <img src="/assets/hieroglyph2.png" alt="Game 2" />
          <h4>Game 2</h4>
        </div>
        <div class="progress" *ngIf="currentGame === 'game2'">1/3 Badges Earned</div>
      </div>
      
      <div class="chamber" id="game3" (mouseover)="showProgress('game3')" (mouseleave)="hideProgress()">
        <div class="chamber-icon">
          <img src="/assets/hieroglyph3.png" alt="Game 3" />
          <h4>Game 3</h4>
        </div>
        <div class="progress" *ngIf="currentGame === 'game3'">2/4 Badges Earned</div>
      </div>
      
      <div class="chamber" id="game4" (mouseover)="showProgress('game4')" (mouseleave)="hideProgress()">
        <div class="chamber-icon">
          <img src="/assets/icons/game4-icon.png" alt="Game 4" />
          <h4>Game 4</h4>
        </div>
        <div class="progress" *ngIf="currentGame === 'game4'">0/2 Badges Earned</div>
      </div>
  
      <div class="chamber" id="game5" (mouseover)="showProgress('game5')" (mouseleave)="hideProgress()">
        <div class="chamber-icon">
          <img src="/assets/icons/game5-icon.png" alt="Game 5" />
          <h3>Game 5</h3>
        </div>
        <div class="progress" *ngIf="currentGame === 'game5'">0/2 Badges Earned</div>
      </div>
    </div>
  
    <div class ="footer-container">
      <p>Keep unlocking badges to discover more chambers!</p>
      <button>Return to Home</button>
    </div>
  </div>
